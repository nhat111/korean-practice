# Render Blueprint for the optional backend (Phase 2). The frontend works without it.
# Dashboard: New + > Blueprint > pick this repo. Secrets marked sync: false are
# entered in the Render dashboard, never committed.
services:
  - type: web
    name: korean-practice-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://your-app.vercel.app,http://localhost:5173
      - key: APP_ACCESS_KEY
        generateValue: true # copy it from the dashboard into the app's Settings page
      - key: AI_PROVIDER
        value: none # none | claude | ollama
      - key: ANTHROPIC_API_KEY
        sync: false # only needed when AI_PROVIDER=claude
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: CLAUDE_EFFORT
        value: medium
