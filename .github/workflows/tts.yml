# Generates natural-voice MP3s (scripts/tts.py, Edge TTS) for new content on master
# and opens a pull request with them, so audio no longer needs a local machine.
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Generate audio

on:
  push:
    branches: [master]
    paths:
      - 'public/data/**.json'
      - '!public/data/audio-index.json'
      - 'scripts/tts*'
      - 'src/speaking/audioKey.ts'
      - 'src/speaking/segments.ts'
      - 'src/patterns/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install edge-tts and ffmpeg
        run: |
          pip install edge-tts
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate missing audio
        run: |
          node scripts/tts-jobs.ts > tts-jobs.json
          python3 scripts/tts.py tts-jobs.json --prune

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/tts
          delete-branch: true
          add-paths: |
            public/audio
            public/data/audio-index.json
          commit-message: Add natural-voice audio for new content
          title: Add natural-voice audio for new content
          body: |
            Generated by `.github/workflows/tts.yml` (`npm run tts --prune` on the latest master).
            Only MP3s under `public/audio/` and `public/data/audio-index.json` change.
